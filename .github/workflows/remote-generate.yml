name: Remote WebUI RSS Generator (Cloudflare Pages)

on:
  repository_dispatch:
    types: [webhook-rss-trigger]
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  update-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: |
          npm install

      - name: Clone rss-proxy
        run: |
          git clone https://github.com/damoeb/rss-proxy.git rss-proxy-src
          cd rss-proxy-src
          npm install

      - name: Update config.json (Only for WebUI Trigger)
        if: github.event.event_type == 'webhook-rss-trigger'
        env:
          FEED_ID: ${{ github.event.client_payload.feed_id }}
          FEED_URL: ${{ github.event.client_payload.url }}
          FEED_SELECT: ${{ github.event.client_payload.selector }}
        run: |
          if [ -z "$FEED_ID" ] || [ -z "$FEED_URL" ]; then
            echo "Empty payload. Skipping config update."
          else
            node -e "
              import fs from 'fs';

              const config = JSON.parse(fs.readFileSync('config.json'));

              const exists = config.feeds.some(
                f => f.id === process.env.FEED_ID
              );

              if (!exists) {

                const selector = process.env.FEED_SELECT || 'article';

                const isAdvanced =
                  selector.includes(' ') ||
                  selector.includes('entry-card');

                config.feeds.push({
                  id: process.env.FEED_ID,
                  title: process.env.FEED_ID + ' の全文RSS',
                  url: process.env.FEED_URL,
                  itemSelector: isAdvanced ? 'a.entry-card-wrap' : 'article',
                  titleSelector: isAdvanced ? 'h2.entry-card-title' : 'h2',
                  linkSelector: isAdvanced ? 'a.entry-card-wrap' : 'a',
                  contentSelector: selector
                });

                fs.writeFileSync(
                  'config.json',
                  JSON.stringify(config, null, 2)
                );

                console.log('config updated');
              } else {
                console.log('feed exists');
              }
            "
          fi

      - name: Generate RSS
        run: |
          mkdir -p dist
          cp index.html dist/

          cd rss-proxy-src
          node src/index.js \
            --config ../config.json \
            --output-dir ../dist

      - name: Commit config changes
        if: github.event.event_type == 'webhook-rss-trigger'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add config.json

          git diff --cached --quiet || \
          (git commit -m "Add new feed via WebUI" && git push)

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: my-nocode-rss
          directory: ./dist
