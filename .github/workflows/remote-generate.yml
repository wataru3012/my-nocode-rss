name: Remote WebUI RSS Generator (Cloudflare Pages)

on:
  repository_dispatch:
    types: [webhook-rss-trigger] # WebUIからの手動追加を検知
  schedule:
    - cron: '0 */12 * * *' # 12時間ごとに自動巡回
  workflow_dispatch:

jobs:
  update-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Update config.json (Only for WebUI Trigger)
        if: github.event.action == 'webhook-rss-trigger'
        run: |
          ID="${{ github.event.client_payload.feed_id }}"
          URL="${{ github.event.client_payload.url }}"
          SELECT="${{ github.event.client_payload.selector }}"
          
          node -e "
            import fs from 'fs';
            const config = JSON.parse(fs.readFileSync('config.json'));
            const exists = config.feeds.some(f => f.id === '$ID');
            if(!exists) {
              config.feeds.push({
                id: '$ID',
                title: '$ID の全文RSS',
                url: '$URL',
                itemSelector: 'article',
                titleSelector: 'h2',
                linkSelector: 'a',
                contentSelector: '$SELECT'
              });
              fs.writeFileSync('config.json', JSON.stringify(config, null, 2));
            }
          "

      - name: Run Scraper Engine
        run: |
          # 成果物を「dist」というフォルダにまとめて出力する設定にします
          mkdir dist
          # ▼直下の index.html を配信フォルダ(dist)へ自動コピーする命令
          cp index.html ./dist/
          npx rss-proxy --config config.json --output-dir ./dist

      - name: Commit and Push config.json Changes
        if: github.event.action == 'webhook-rss-trigger'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add config.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Add new feed via WebUI [${{ github.event.client_payload.feed_id }}]" && git push)

      # ★変更点：生成されたRSSフィードをCloudflare Pagesに直接送り込む
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'my-nocode-rss' # Cloudflare側で作るプロジェクト名
          directory: './dist' # RSSが生成されるフォルダ
