name: Update RSS Feeds

on:
  schedule:
    # 毎日 日本時間の午前 2:00（世界標準時 UTC の 17:00）に定期実行
    - cron: '0 17 * * *'
  workflow_dispatch: # 手動実行用ボタン

permissions:
  contents: write # GitHub Pagesへのコミット・プッシュに必要

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Create public directory
      run: mkdir -p public

    - name: Fetch RSS from Render RSSHub
      run: |
        mkdir -p public
        
        # ------------------------------------------------------------------
        # 最新の RSSHub (2026年5月版) の新しいパラメータ名 (***Selector) に修正
        # ------------------------------------------------------------------
        TARGET_URL="https://androidjiten.com/archives/sitemap" # 一覧ページのURL
        ITEM_SEL="%2Epost-item"                                # .post-item をエンコード
        TITLE_SEL="a"
        LINK_SEL="a"
        
        # 最新仕様のキー名（itemSelector, titleSelector, linkSelector）でURLを合成
        API_URL="https://rsshub-latest-soe9.onrender.com/html?url=${TARGET_URL}&itemSelector=${ITEM_SEL}&titleSelector=${TITLE_SEL}&linkSelector=${LINK_SEL}"
        
        echo "Fetching from: ${API_URL}"
        
        # 5回リトライ、30秒間隔で実行
        curl -sLf --retry 5 --retry-delay 30 "${API_URL}" -o public/androidjiten.xml

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public
        keep_files: false
