<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>RSS Engine</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 40px auto; }
    .card { padding: 12px; border: 1px solid #ddd; margin-bottom: 10px; }
    a { text-decoration: none; }
  </style>
</head>
<body>
  <h1>RSS Engine</h1>
  <div id="feeds"></div>

  <script>
    fetch("./config.json")
      .then(r => r.json())
      .then(cfg => {
        const container = document.getElementById("feeds");

        cfg.feeds.forEach(f => {
          const div = document.createElement("div");
          div.className = "card";

          div.innerHTML = `
            <h3>${f.title}</h3>
            <p><a href="./${f.id}.xml">RSSを見る</a></p>
          `;

          container.appendChild(div);
        });
      });
  </script>
</body>
</html>
